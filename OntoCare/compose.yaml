services:
  ontocare:
    build: .
    ports:
      - "8080:8000"
    restart: unless-stopped
    volumes:
      - ./demo_api_config.json:/app/demo_api_config.json:ro
      - handoffs:/app/data/handoffs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/judge-health',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
volumes:
  handoffs:
