<style>
body.assistant-open main{margin-right:400px}.assistant-toggle{position:fixed;right:20px;bottom:20px;background:#111;color:white;z-index:3}.ops-assistant{position:fixed;right:12px;top:86px;bottom:12px;width:380px;background:#fff;border:1px solid #e5e5e5;border-radius:8px;z-index:3;display:flex;flex-direction:column}.ops-assistant[hidden]{display:none}.ops-head{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #e5e5e5}.ops-head h2{margin:0;font-size:15px}.ops-log{flex:1;overflow:auto;padding:12px;min-height:0}.ops-message{background:#f5f5f5;padding:12px;border-radius:8px;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}.ops-message.user{background:#111;color:white;margin-left:35px}.ops-message .small{display:block;margin-top:8px;color:#666}.ops-compose{padding:12px;border-top:1px solid #eee}.ops-shortcuts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.ops-shortcuts button{font-size:11px;padding:5px 8px;text-align:left}.ops-compose textarea{width:100%;min-height:65px;font:inherit;border:1px solid #ddd;border-radius:6px;padding:8px;resize:vertical}.ops-send{background:#111;color:white;float:right;margin-top:6px}.ops-compose:after{content:'';display:block;clear:both}.ops-trace{white-space:normal;margin-top:10px;border-top:1px solid #ddd;padding-top:8px}.ops-trace summary{cursor:pointer;font-size:12px}.ops-node{position:relative;display:block;width:100%;text-align:left;border:0;border-left:2px solid #ddd;border-radius:0;margin-left:5px;padding:9px 12px;background:transparent;font-size:12px}.ops-node:before{content:'';position:absolute;left:-5px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--node-color)}.ops-node:after{content:'↓';display:block;color:#999}.ops-node:last-child:after{display:none}.ops-node small{display:block;color:#666}.ops-evidence{white-space:pre-wrap}.ops-compose button:disabled{opacity:.45;cursor:wait}@media(max-width:1100px){body.assistant-open main{margin-right:auto}.ops-assistant{box-shadow:0 3px 25px #0001}}@media(max-width:767px){.ops-assistant{top:auto;bottom:0;left:0;right:0;width:100%;height:70dvh;border-radius:8px 8px 0 0}.assistant-toggle{bottom:12px}.ops-head{padding:10px}}
</style>
<button class="assistant-toggle" id="opsOpen" aria-controls="opsAssistant" aria-expanded="false">AI 经营归因助手</button>
<aside class="ops-assistant" id="opsAssistant" aria-label="经营归因助手" hidden>
 <div class="ops-head"><h2>经营归因助手</h2><button id="opsClose" aria-label="折叠经营归因助手">折叠</button></div>
 <div class="ops-log" id="opsLog" role="log" aria-live="polite"><div class="ops-message">您好，我是经营归因助手。可以根据全量工单、本体规则和归因记录，为您整理分析建议。每次回答都可查看证据链与源表原文。</div></div>
 <form class="ops-compose" id="opsForm"><div class="ops-shortcuts" id="opsShortcuts"></div><label for="opsInput" class="small muted">询问数据、归因候选或改进建议</label><textarea id="opsInput" maxlength="2000" placeholder="例如：这些工单应该优先核查什么？" required></textarea><button class="ops-send" id="opsSend" type="submit">发送</button></form>
</aside>
<script>
(()=>{
 const el=id=>document.getElementById(id);let context={},busy=false;
 function toggle(open){el('opsAssistant').hidden=!open;el('opsOpen').hidden=open;el('opsOpen').setAttribute('aria-expanded',String(open));document.body.classList.toggle('assistant-open',open);if(open)el('opsInput').focus();else el('opsOpen').focus()}
 el('opsOpen').onclick=()=>toggle(true);el('opsClose').onclick=()=>toggle(false);
 function message(text,user=false){const box=document.createElement('div');box.className='ops-message'+(user?' user':'');box.textContent=text;el('opsLog').append(box);el('opsLog').scrollTop=el('opsLog').scrollHeight;return box}
 function evidence(node,data){const entries=node.evidence_rows.map(n=>data.evidence[String(n)]).filter(Boolean);show(node.label,'<p>'+esc(node.definition)+'</p><p class="muted small">以下为执行记录与证据摘要，不代表已确认根因。</p>'+ (entries.length?entries.map(r=>'<div class="source-row"><b>客诉工单信息 · Excel 第 '+r.row+' 行</b><p>产品：'+esc(r.product)+' · SKU：'+esc(r.sku)+' · 订单：'+esc(r.order_no)+'</p><div class="email">'+esc(r.email)+'</div></div>').join(''):'<p>本节点无匹配工单。规则定义如上，不补造引用。</p>'))}
 function trace(box,data){const details=document.createElement('details');details.className='ops-trace';const title=document.createElement('summary');title.textContent='查看 Ontology & Trace 证据链';details.append(title);for(const node of data.trace_chain){const b=document.createElement('button');b.className='ops-node';b.style.setProperty('--node-color',({data:'#1e88e5',ontology:'#00a651',rule:'#b8860b',suggestion:'#d0021b'})[node.type]);b.textContent=node.label;b.title=node.definition;const sub=document.createElement('small');sub.textContent=node.evidence_rows.length?'源表行号：'+node.evidence_rows.join('、'):'查看规则定义与适用范围';b.append(sub);b.onclick=()=>evidence(node,data);details.append(b)}const tools=document.createElement('small');tools.textContent='后台读取：'+data.tool_calls.map(t=>t.name).join(' → ');details.append(tools);box.append(details)}
 async function submit(text){if(busy||!text.trim())return;busy=true;message(text,true);el('opsInput').value='';el('opsSend').disabled=true;el('opsShortcuts').querySelectorAll('button').forEach(b=>b.disabled=true);const pending=message('正在读取本体实体与归因 Trace…');try{if(location.protocol==='file:')throw Error('请在本地服务的 /analytics 页面使用助手。');const res=await fetch('/api/analytics/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,context}),signal:AbortSignal.timeout(25000)});const data=await res.json();if(!res.ok)throw Error(data.error||'请求未完成');context=data.context;pending.textContent=data.reply;const mode=document.createElement('small');mode.className='small';mode.textContent=data.mode;pending.append(mode);trace(pending,data)}catch(err){pending.textContent='本次分析未完成：'+err.message+' 您可以重试；看板与已有证据仍可查看。'}finally{busy=false;el('opsSend').disabled=false;el('opsShortcuts').querySelectorAll('button').forEach(b=>b.disabled=false);el('opsLog').scrollTop=el('opsLog').scrollHeight}}
 for(const q of ['X10 Pro 最近工单为什么多？','RC3 候选有哪些问题特征？','过保临界点的工单有什么共同点？']){const b=document.createElement('button');b.type='button';b.textContent=q;b.onclick=()=>submit(q);el('opsShortcuts').append(b)}
 el('opsForm').onsubmit=e=>{e.preventDefault();submit(el('opsInput').value)};el('opsInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit(el('opsInput').value)}};
})();
</script>
