<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OntoCare · 商家工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#20334d;font:15px/1.65 system-ui}header{background:white;border-bottom:1px solid #e4eaf3;padding:18px 5%;display:flex;align-items:center;gap:20px}header b{font-size:20px}a{color:#176cf5;text-decoration:none}header a{margin-left:auto}main{max-width:1250px;margin:28px auto;padding:0 22px}h1{font-size:25px;margin:0}p{color:#748197;margin:6px 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:white;border:1px solid #e1e8f2;border-radius:18px;padding:24px}h2{font-size:18px;margin:0 0 16px}label{display:block;font-size:13px;color:#60748d;margin:12px 0 7px}select,input,textarea{font:inherit;width:100%;border:1px solid #d8e2ee;border-radius:9px;background:white;padding:11px;color:#20334d}textarea{resize:vertical;line-height:1.7;min-height:270px}button{cursor:pointer;border:0;border-radius:9px;background:#126bfa;color:white;padding:12px 20px;font:inherit}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;align-items:center;gap:14px;margin-top:18px}.actions select{width:130px}.muted{color:#7c899a;font-size:12px}.secondary{background:#edf4ff;color:#1763d3}#progress{padding-left:22px;font-size:13px;color:#527599}#refs a{display:block;font-size:12px;overflow-wrap:anywhere;margin:8px 0}details{margin-top:22px;border-top:1px solid #e4ebf4;padding-top:16px}summary{cursor:pointer;color:#547396}#checks{margin-top:14px}.check{padding:12px 0;border-bottom:1px solid #eef2f7}.check b{font-size:13px}.check span{float:right;font-size:12px;color:#197367}.check div{font-size:12px;color:#687e97;clear:both}#status{font-size:13px;color:#396d96}#draft{min-height:330px}#source{font-size:12px} @media(max-width:800px){.grid{grid-template-columns:1fr}header{padding:15px 22px}main{margin-top:20px}.panel{padding:18px}}
.assist-card{margin-top:12px;padding:12px;background:#fafafa;border:1px solid #e5e5e5;border-radius:8px}.assist-card:empty{display:none}.tone-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tone-row button{padding:4px 12px;border:1px solid #e5e5e5;border-radius:14px;font-size:12px;color:#666;background:#fff}.tone-row button.active{border-color:#000;color:#000;background:#fafafa}#draftWarning{color:#D0021B;font-size:12px}button{transition:opacity .15s}button:hover{opacity:.8}</style><link rel="stylesheet" href="anker.css">
<style>[hidden]{display:none!important}.merchant-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}.merchant-grid>.panel{min-width:0}.merchant-grid>.inbox-panel{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.inbox-panel h2{margin:0}.inbox-panel label{margin:0}.inbox-panel select{width:min(350px,100%)}.inbox-panel #viewMail{margin-top:0!important}.merchant-grid .actions{flex-wrap:wrap}main{max-width:1600px!important}.inbox-panel{padding:16px!important}.inbox-panel select{font-size:12px} @media(max-width:800px){.merchant-grid{grid-template-columns:1fr!important}}</style><link rel="stylesheet" href="/responsive.css"><link rel="stylesheet" href="/workspace.css?v=20261017-5"><link rel="stylesheet" href="/refinements.css?v=20261017-5"><link rel="stylesheet" href="/judge-demo.css?v=1"><header class="topbar app-header">
  <a class="app-brand" href="/" aria-label="OntoCare 首页"><img class="anker-wordmark" src="/assets/brand/anker-wordmark.png" alt="ANKER" width="100" height="40"><span class="app-brand-copy"><b>OntoCare</b><span id="subtitle">安克售后服务</span></span></a>
  <nav class="view-tabs" aria-label="主导航"><a href="/">用户端</a><a href="/merchant" class="active" aria-current="page">商家端</a></nav>
  <div class="app-header-actions"><span class="workspace-label">售后服务工作台</span></div>
</header>
<main class="merchant-workspace">
<div class="workspace-tabs" id="merchantTabs" role="tablist" aria-label="商家功能">
  <button type="button" id="tab-mail" class="active" role="tab" aria-selected="true" aria-controls="merchant-mail" data-workspace-tab="mail">邮件工作台</button>
  <button type="button" id="tab-analytics" role="tab" aria-selected="false" aria-controls="merchant-analytics" tabindex="-1" data-workspace-tab="analytics">分析看板</button>
</div>
<section class="workspace-panel" id="merchant-mail" role="tabpanel" aria-labelledby="tab-mail" data-workspace-panel="mail"><h1>把客户来信，整理成有依据的回复</h1><p>从来信到回复，每一步都有据可查。</p>
<div class="grid merchant-grid"><section class="panel inbox-panel"><h2>工单收件箱</h2><label for="ticket">从工单中选择，或直接粘贴正文</label><select id="ticket"><option value="">新邮件 / 自行粘贴</option></select><button id="viewMail" class="secondary" style="margin-top:12px">查看邮件</button></section><section class="panel"><h2>客户来信</h2><div id="identity" class="identity" hidden></div><div id="source"></div><div id="caseSummary" class="assist-card"></div><div id="emotionCard" class="assist-card" aria-live="polite"></div><label for="email">邮件正文</label><textarea id="email" placeholder="在这里粘贴客户的售后邮件…"></textarea><div class="actions"><select id="language" aria-label="回复语言"><option value="auto">跟随客户邮件语言</option><option value="nl">Nederlands</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="en">英文回复</option><option value="zh">中文回复</option></select><button id="generate">一键生成邮件回复</button></div><p class="muted">仅生成草稿；附件链接不会自动下载。物流来自已有资料。</p><ol id="progress" aria-live="polite"></ol></section>
<section class="panel"><h2>回复草稿 <span class="muted">可编辑</span></h2><div id="status" role="status">选择一封邮件，开始核对。</div><div class="actions"><a href="#analytics" data-open-workspace="analytics">查看归因分析 / 报告 / 知识库补课 →</a></div><div id="evidenceStatus" class="muted"></div><div id="tones" class="tone-row"><button data-tone="formal">正式</button><button data-tone="friendly">友好</button><button data-tone="concise">简洁</button><button data-tone="empathetic">共情</button><button id="restoreTone">恢复原文</button></div><div class="muted">语气调整由模型改写正文；保留订单、数字和引用，发送前仍需核对。</div><label for="subject">邮件主题</label><input id="subject" placeholder="生成后可修改"><div id="draftLanguage" class="draft-language" role="status" hidden></div><div class="actions translation-controls"><button id="makeVersions" class="secondary">生成三版本</button><label for="translateLang">翻译为</label><select id="translateLang" aria-label="翻译目标语言"><option value="zh">中文</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="nl">Nederlands</option></select><button id="translate" class="secondary">翻译主题与正文</button></div><div id="versions" class="tone-row" hidden><button data-version="short">短版</button><button data-version="standard">标准版</button><button data-version="detailed">详细版</button></div><div id="selectionTools" class="tone-row" hidden><button data-edit="rewrite">改写选中段</button><button data-edit="shorten">缩短选中段</button><button data-edit="friendlier">选中段更友好</button></div><label for="draft">回复正文</label><textarea id="draft" placeholder="生成结果将显示在这里…"></textarea><div class="actions"><button id="copy" class="secondary" disabled>复制邮件正文</button><span class="muted">尚未发送</span></div><div class="actions"><button id="demoSend" class="secondary">检查并模拟发送</button><button id="applyFix" class="secondary" hidden>应用建议</button></div><div id="draftWarning" role="alert"></div><section class="mail-sources" aria-label="回复来源"><h3>回复来源</h3><p>来源编号用于核对依据，不会出现在邮件正文和复制内容里。</p><div id="refs"></div></section><details open><summary>核对结果与引用依据</summary><div id="checks"></div></details></section></div></section>
<section class="workspace-panel" id="merchant-analytics" role="tabpanel" aria-labelledby="tab-analytics" data-workspace-panel="analytics" hidden>
  <iframe id="analyticsFrame" class="analytics-frame" title="分析看板与经营归因" data-src="/analytics?embedded=merchant" loading="lazy"></iframe>
</section>
</main>
<script src="/merchant-workspace.js?v=20261017-6"></script>
<script src="/mail-presentation.js?v=20261017-5"></script>
<script src="/merchant_assist.js"></script>
<script>
let rows=[],inbox=[],busy=false;
const state={originalDraft:null,originalSubject:null,originalLanguage:'en',currentLanguage:'en',currentTone:null};
const $=id=>document.getElementById(id);
const draftView=MailPresentation.create($('draft'));
function getDraft(){return draftView.readRaw();}
function setDraft(raw){draftView.write(raw);}
function clearDraft(){ state.originalDraft=null;state.currentTone=null;if(window.MerchantExtra)MerchantExtra.reset();document.querySelectorAll('[data-tone]').forEach(b=>b.classList.remove('active'));$('draftWarning').textContent='';$('applyFix').hidden=true;renderEmotion(); $('subject').value='';draftView.clear();$('refs').replaceChildren();$('checks').replaceChildren();$('copy').disabled=true;$('status').textContent='内容已更新，请生成新草稿。'; }
fetch('/api/mail/tickets').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{rows=d.rows;for(const r of rows){const o=document.createElement('option');o.value=r.source_row;o.textContent=`第 ${r.source_row} 行 · ${r['产品名']} · ${r['咨询场景']==='Shipping inquiry'?'物流':'故障 / 使用'}`;$('ticket').append(o)}const requested=new URLSearchParams(location.search).get('ticket');if(requested&&rows.some(r=>String(r.source_row)===requested)){$('ticket').value=requested;loadMail();}}).catch(()=>{$('status').textContent='工单读取失败，请刷新或粘贴正文。'});
function showIdentity(fields){const box=$('identity');box.replaceChildren();box.hidden=false;for(const [label,value] of fields){const cell=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value||'未提供';cell.append(dt,dd);box.append(cell)}}
function loadMail(){const h=inbox.find(x=>'handoff:'+x.id===$('ticket').value);const r=rows.find(x=>x.source_row===Number($('ticket').value));$('email').value=h?h.message:(r?r['客户首封邮件内容']:'');$('source').replaceChildren();if(h){showIdentity([['客户 ID',h.customer_id],['会话 ID（非客户 ID）',h.session_id],['产品',h.product],['SKU',h.sku],['订单号',h.order_id],['待处理类型',h.channel==='human'?'人工请求 · 尚未接通':'对话转邮件 · 尚未发送']]);}else if(r){showIdentity([['客户 ID',null],['产品',r['产品名']],['SKU',r.SKU],['订单号',r['订单号']],['来源','原表第 '+r.source_row+' 行'],['客户邮箱',null]]);const a=document.createElement('a');a.href='/api/sources/mail-'+r.source_row;a.target='_blank';a.rel='noopener';a.textContent='查看原始邮件 · 第 '+r.source_row+' 行';$('source').append(a);}else{$('identity').hidden=true;}clearDraft();if(window.MerchantExtra)MerchantExtra.summary();}
$('ticket').onchange=loadMail;$('viewMail').onclick=loadMail;
fetch('/api/handoffs').then(r=>r.json()).then(d=>{inbox=d.records;for(const h of inbox){const o=document.createElement('option');o.value='handoff:'+h.id;o.textContent=(h.channel==='human'?'待人工处理':'对话转邮件')+' · '+h.id.slice(0,8)+' · '+(h.product||'产品待确认');$('ticket').append(o)}const id=new URLSearchParams(location.search).get('handoff');if(id&&inbox.some(h=>h.id===id)){$('ticket').value='handoff:'+id;loadMail()}}).catch(()=>{$('status').textContent='待处理列表读取失败，请刷新重试。'});
$('email').oninput=()=>{clearDraft();$('identity').hidden=true;$('source').replaceChildren();};$('language').onchange=clearDraft;
$('generate').onclick=async()=>{if(busy)return;const message=$('email').value.trim();if(!message){$('status').textContent='请先输入邮件正文。';return;}clearDraft();busy=true;for(const id of ['generate','ticket','email','language','viewMail'])$(id).disabled=true;$('progress').replaceChildren();$('status').textContent='正在核对邮件…';let complete=false;
try{const r=await fetch('/api/mail/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,ticket_row:Number($('ticket').value)||null,handoff_id:$('ticket').value.startsWith('handoff:')?$('ticket').value.slice(8):null,language:$('language').value})});if(!r.ok){const d=await r.json();throw Error(d.error||'请求失败')};const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();buffer+=decoder.decode(value,{stream:!done});const lines=buffer.split('\n');buffer=lines.pop();for(const line of lines){if(!line.trim())continue;const e=JSON.parse(line);if(e.type==='progress'){const li=document.createElement('li');li.textContent=e.text;$('progress').append(li)}if(e.type==='error')throw Error(e.text);if(e.type==='result'){complete=true;const d=e.data;$('subject').value=d.subject;draftView.references(d.citations);setDraft(d.draft);state.originalDraft=d.draft;$('status').textContent='草稿已生成 · '+(d.trace.model_status==='OK'?'DeepSeek 生成':(d.trace.model_calls>0?'模型未成功，规则回退':'规则与资料生成'))+' · 请核对后使用';for(const [i,c] of d.citations.entries()){const a=document.createElement('a');a.href=c.url;a.target='_blank';a.rel='noopener';a.textContent=`来源 ${i+1} · ${c.label}`;$('refs').append(a)}for(const c of d.checks){const box=document.createElement('div');box.className='check';const b=document.createElement('b'),s=document.createElement('span'),t=document.createElement('div');b.textContent=c.rule;s.textContent=({FIXTURE_MATCHED:'已匹配工单',RESOLVED:'已识别',CONFIRMED:'已确认',UNKNOWN:'待确认',CONFLICTED:'信息冲突',FOUND:'已找到资料',NOT_FOUND:'未查到',NOT_PROVIDED:'未提供',ERROR_CODE_WORKFLOW:'错误码流程',FAQ_CACHE:'固定答复',REFERENCE_REVIEW:'资料待复核',SAFETY_REVIEW:'安全核查',ATTEMPTED_STEPS_REVIEW:'检查后仍未解决',WORKFLOW:'规则处理',HUMAN_REVIEW:'人工核查'}[c.status]||c.status);t.textContent=c.detail;box.append(b,s,t);$('checks').append(box)}$('copy').disabled=false;if(window.MerchantExtra)MerchantExtra.evidence(d);}}if(done)break;}if(!complete)throw Error('连接中断，请重新生成');}catch(e){$('status').textContent=e.message;$('copy').disabled=true;}finally{busy=false;for(const id of ['generate','ticket','email','language','viewMail'])$(id).disabled=false;}};
$('copy').onclick=async()=>{if(!checkBeforeUse())return;try{await navigator.clipboard.writeText($('subject').value+'\n\n'+$('draft').value);$('status').textContent='已复制邮件正文，引用来源保留在下方，尚未发送。'}catch{$('status').textContent='无法自动复制，请选中正文手动复制。'}};

function renderEmotion(){const text=$('email').value.trim(),box=$('emotionCard');box.replaceChildren();if(!text)return;const e=MailAssist.emotion(text);const title=document.createElement('div');title.textContent='情绪提示 · '+e.label+' · '+e.score+'/10（关键词规则）';const chart=document.createElementNS('http://www.w3.org/2000/svg','svg');chart.setAttribute('viewBox','0 0 200 60');chart.style.width='200px';chart.style.height='60px';const point=document.createElementNS(chart.namespaceURI,'circle');point.setAttribute('cx','100');point.setAttribute('cy',String(55-e.score*5));point.setAttribute('r','5');const tip=document.createElementNS(chart.namespaceURI,'title');tip.textContent='当前邮件 · 情绪分 '+e.score+'（规则估计）';point.append(tip);chart.append(point);const note=document.createElement('div');note.className='muted';note.textContent='仅有当前邮件，无法判断历史情绪趋势。分数不是模型置信度。';box.append(title,chart,note);if(e.score>=7){const alert=document.createElement('div');alert.textContent='建议人工关注客户诉求；不因此改变售后资格。';alert.style.color='#D0021B';box.append(alert);}}
for(const button of document.querySelectorAll('[data-tone]'))button.onclick=()=>MerchantExtra.tone(button.dataset.tone);
$('restoreTone').onclick=()=>MerchantExtra.restore();
$('draft').addEventListener('input',()=>{state.originalDraft=getDraft();if(window.MerchantExtra)MerchantExtra.remember();state.currentTone=null;document.querySelectorAll('[data-tone]').forEach(b=>b.classList.remove('active'));$('draftWarning').textContent='草稿已编辑，使用前会重新检查。';});
function checkBeforeUse(){if(busy||!$('draft').value.trim())return false;const hits=MailAssist.checkDraft(getDraft());$('draftWarning').replaceChildren();$('applyFix').hidden=!hits.length;for(const hit of hits){const p=document.createElement('div');p.textContent='需核查：“'+hit.text+'” → 建议：'+hit.suggestion;$('draftWarning').append(p);}return !hits.length;}
$('applyFix').onclick=()=>{state.originalDraft=getDraft();setDraft(MailAssist.applySuggestions(getDraft()));state.currentTone=null;checkBeforeUse();$('status').textContent='已应用保守措辞，请人工复核；可恢复原文。';};
$('demoSend').onclick=()=>{if(checkBeforeUse())$('status').textContent='已完成模拟发送（Demo 模式，未真实发信）。规则检查不代表内容全部正确。';};
</script><script src="/merchant_extra.js?v=20261017-5"></script></html>
