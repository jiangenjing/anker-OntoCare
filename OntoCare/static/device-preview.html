<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OntoCare · 手机与电脑适配预览</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#eee;font:14px system-ui;color:#111}h1{font-size:22px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select,a{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;background:white;color:#111}.devices{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}.phone{width:426px;padding:12px;background:#161616;border-radius:34px}.phone iframe{width:402px;height:874px;border:0;border-radius:24px;background:white}.desktop{width:732px;height:474px;padding:6px;background:#222;border-radius:12px;overflow:hidden}.desktop iframe{width:1440px;height:900px;transform:scale(.5);transform-origin:top left;border:0;background:white}p{max-width:700px;line-height:1.6}@media(max-width:460px){body{padding:8px}.phone{width:100%;padding:0;background:none}.phone iframe{width:100%;border-radius:0}.desktop{display:none}}</style><h1>OntoCare · 跨设备预览</h1><p>手机以 402 × 874 CSS 像素模拟 iPhone 17 Pro 竖屏比例；电脑以 1440 × 900 模拟 MacBook 浏览器窗口。此页验证布局，实际安全区、软键盘、录音权限请以真机 Safari 为准。</p><nav><label>查看页面 <select id="page"><option value="/">智能客服</option><option value="/merchant">商家工作台</option><option value="/analytics">可视化看板</option><option value="/analytics#view=attribution">归因与决策</option><option value="/benchmark.html#view=results">评测结果</option><option value="/benchmark.html#view=business">业务约束基线</option><option value="/benchmark.html#view=principles">评测原理 / 学习流程</option><option value="/models.html">模型与多模态</option></select></label><a href="/">返回应用</a></nav><p id="layoutStatus" role="status">正在检查布局…</p><div class="devices"><div><h2>手机 · 402 × 874</h2><div class="phone"><iframe title="手机预览" id="phone" src="/"></iframe></div></div><div><h2>电脑 · 1440 × 900（缩放预览）</h2><div class="desktop"><iframe title="电脑预览" id="desktop" src="/"></iframe></div></div></div><script>function checkLayout(){document.getElementById('layoutStatus').textContent=['phone','desktop'].map(id=>{const d=document.getElementById(id).contentDocument;return id+': 视口 '+d.documentElement.clientWidth+' / 内容 '+d.documentElement.scrollWidth+' px';}).join(' · ')};for(const id of ['phone','desktop'])document.getElementById(id).addEventListener('load',()=>{checkLayout();setTimeout(checkLayout,1000)});document.getElementById('page').onchange=function(){document.getElementById('layoutStatus').textContent='正在检查布局…';for(const id of ['phone','desktop'])document.getElementById(id).src=this.value;setTimeout(checkLayout,500);};</script></html>
